<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dino Dash</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at top, #a2d9ff 0%, #7bbcf8 45%, #264e8f 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        color: #0f172a;
      }

      .container {
        width: min(980px, 100%);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 28px;
        box-shadow: 0 28px 90px rgba(15, 23, 42, 0.18);
        overflow: hidden;
      }

      header {
        padding: 28px 32px 0;
      }

      h1 {
        font-size: clamp(2.2rem, 3vw, 3.4rem);
        letter-spacing: -0.03em;
        margin-bottom: 14px;
        color: #0f172a;
      }

      p {
        margin-bottom: 22px;
        max-width: 760px;
        line-height: 1.7;
        color: #334155;
      }

      .game-board {
        position: relative;
        width: 100%;
        height: 300px;
        background: linear-gradient(180deg, #e6f4ff 0%, #f2f9ff 45%, #f8fafb 100%);
        border-top: 5px solid rgba(37, 99, 235, 0.18);
        border-bottom: 5px solid rgba(37, 99, 235, 0.18);
        overflow: hidden;
      }

      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 32px;
        background: linear-gradient(90deg, #88b5eb 0%, #acc8ed 100%);
      }

      .dino {
        position: absolute;
        bottom: 32px;
        left: 58px;
        width: 52px;
        height: 52px;
        background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
        border-radius: 14px;
        box-shadow: inset -6px -6px 0 rgba(255, 255, 255, 0.08), 0 18px 28px rgba(15, 23, 42, 0.18);
        transform-origin: center bottom;
      }

      .dino.running {
        animation: run-step 0.42s steps(2) infinite;
      }

      @keyframes run-step {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(0, -3px) scale(1.02, 0.98); }
      }

      .obstacle {
        position: absolute;
        bottom: 32px;
        display: grid;
        align-items: end;
        justify-items: center;
        will-change: transform;
      }

      .obstacle.rock {
        width: 44px;
        height: 30px;
        background: linear-gradient(180deg, #fbfbfb 0%, #e5e9f1 100%);
        border-radius: 12px;
        clip-path: polygon(50% 0%, 100% 28%, 84% 100%, 16% 100%, 0% 28%);
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }

      .obstacle.cactus {
        width: 24px;
        height: 58px;
        background: linear-gradient(180deg, #4dbb78 0%, #2c7c42 100%);
        border-radius: 16px;
      }

      .obstacle.cactus::before,
      .obstacle.cactus::after {
        content: '';
        position: absolute;
        width: 12px;
        height: 18px;
        background: inherit;
        border-radius: 10px;
      }

      .obstacle.cactus::before {
        left: -12px;
        top: 12px;
      }

      .obstacle.cactus::after {
        right: -12px;
        top: 24px;
      }

      .obstacle.spike {
        width: 30px;
        height: 30px;
        background: linear-gradient(180deg, #ffd47d 0%, #f8a84c 100%);
        clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        box-shadow: 0 10px 26px rgba(15, 23, 42, 0.1);
      }

      .scoreboard {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        padding: 22px 32px 0;
      }

      .score-info {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
      }

      .score {
        font-size: 1.35rem;
        font-weight: 800;
        color: #0f172a;
      }

      .status {
        color: #475569;
        min-width: 200px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: end;
        align-items: center;
      }

      .slider-group {
        display: grid;
        gap: 10px;
        min-width: 220px;
      }

      label {
        font-size: 0.95rem;
        color: #475569;
      }

      input[type='range'] {
        width: 100%;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        color: #fff;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        cursor: pointer;
        font-weight: 800;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 28px rgba(37, 99, 235, 0.22);
      }

      .footer {
        padding: 0 32px 28px;
        color: #475569;
        font-size: 0.95rem;
      }

      .intro-box {
        display: grid;
        gap: 14px;
        padding: 0 32px 20px;
        border-bottom: 1px solid rgba(15, 23, 42, 0.08);
      }

      .help {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #475569;
      }

      .help span {
        width: 10px;
        height: 10px;
        background: #2563eb;
        border-radius: 50%;
      }

      @media (max-width: 700px) {
        .scoreboard {
          grid-template-columns: 1fr;
        }

        .controls {
          justify-content: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Dino Dash</h1>
      </header>
      <div class="intro-box">
        <p>Springe über stylische Hindernisse und passe die Geschwindigkeit an. Tippe oder drücke die Leertaste zum Springen.</p>
        <div class="help"><span></span> Bei Spielstart bewegt sich das Spielfeld.</div>
      </div>
      <div class="game-board" id="gameBoard">
        <div class="dino running" id="dino"></div>
        <div class="ground"></div>
      </div>
      <div class="scoreboard">
        <div class="score-info">
          <div class="score">Punkte: <strong id="score">0</strong></div>
          <div class="status" id="status">Bereit</div>
        </div>
        <div class="controls">
          <div class="slider-group">
            <label for="speedRange">Geschwindigkeit: <strong id="speedValue">8</strong></label>
            <input id="speedRange" type="range" min="4" max="14" value="8" />
          </div>
          <button class="button" id="restartButton">Neu starten</button>
        </div>
      </div>
      <div class="footer">Tipp: Höhere Geschwindigkeit bringt mehr Punkte, aber auch mehr Herausforderung.</div>
    </div>

    <script>
      const gameBoard = document.getElementById('gameBoard');
      const dino = document.getElementById('dino');
      const scoreEl = document.getElementById('score');
      const statusEl = document.getElementById('status');
      const restartButton = document.getElementById('restartButton');
      const speedRange = document.getElementById('speedRange');
      const speedValue = document.getElementById('speedValue');

      let score = 0;
      let isRunning = false;
      let isJumping = false;
      let velocityY = 0;
      let jumpY = 0;
      let gameSpeed = Number(speedRange.value);
      let obstacleTimer = null;
      let frameId = null;
      let lastTime = null;
      const gravity = 0.85;
      const jumpStrength = 14;
      const obstacles = [];
      const spawnBase = 1800;

      function resetGame() {
        score = 0;
        isRunning = false;
        isJumping = false;
        velocityY = 0;
        jumpY = 0;
        obstacles.length = 0;
        gameBoard.querySelectorAll('.obstacle').forEach((node) => node.remove());
        dino.style.transform = 'translate(0px, 0px) rotate(0deg)';
        dino.classList.add('running');
        scoreEl.textContent = score;
        statusEl.textContent = 'Bereit';
        stopLoop();
        clearInterval(obstacleTimer);
      }

      function startGame() {
        if (isRunning) return;
        isRunning = true;
        statusEl.textContent = 'Spielt...';
        const interval = Math.max(900, spawnBase - (gameSpeed - 4) * 90);
        obstacleTimer = setInterval(createObstacle, interval);
        lastTime = null;
        frameId = requestAnimationFrame(gameLoop);
      }

      function stopLoop() {
        if (frameId) {
          cancelAnimationFrame(frameId);
          frameId = null;
        }
      }

      function createObstacle() {
        if (!isRunning) return;
        const obstacle = document.createElement('div');
        obstacle.classList.add('obstacle');
        const type = Math.random();
        if (type < 0.4) {
          obstacle.classList.add('rock');
        } else if (type < 0.75) {
          obstacle.classList.add('cactus');
        } else {
          obstacle.classList.add('spike');
        }

        const boardWidth = gameBoard.clientWidth;
        obstacle.style.left = `${boardWidth + 20}px`;
        gameBoard.appendChild(obstacle);
        obstacles.push({ node: obstacle, x: boardWidth + 20, width: obstacle.offsetWidth });
      }

      function gameLoop(timestamp) {
        if (!isRunning) return;
        if (!lastTime) lastTime = timestamp;
        const delta = Math.min((timestamp - lastTime) / 16.67, 2);
        lastTime = timestamp;

        updateDino(delta);
        updateObstacles(delta);
        updateScore(delta);

        frameId = requestAnimationFrame(gameLoop);
      }

      function updateDino(delta) {
        if (isJumping) {
          velocityY += gravity * delta;
          jumpY += velocityY * delta;
          if (jumpY >= 0) {
            jumpY = 0;
            velocityY = 0;
            isJumping = false;
            dino.style.transform = 'translate(0px, 0px) scale(1.15, 0.82)';
            setTimeout(() => {
              if (!isJumping) dino.style.transform = 'translate(0px, 0px) rotate(0deg)';
            }, 130);
          } else {
            const forward = Math.min(70, Math.abs(jumpY) * 0.75);
            const tilt = Math.max(-15, Math.min(10, -velocityY * 1.6));
            dino.style.transform = `translate(${forward}px, ${jumpY}px) rotate(${tilt}deg)`;
          }
        }
      }

      function updateObstacles(delta) {
        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= gameSpeed * 4 * delta;
          obs.node.style.left = `${obs.x}px`;

          if (obs.x + obs.width < -20) {
            obs.node.remove();
            obstacles.splice(i, 1);
            continue;
          }

          if (checkCollision(obs.node)) {
            finishGame();
            return;
          }
        }
      }

      function checkCollision(obstacle) {
        const dRect = dino.getBoundingClientRect();
        const oRect = obstacle.getBoundingClientRect();
        return (
          dRect.right > oRect.left + 6 &&
          dRect.left < oRect.right - 6 &&
          dRect.bottom > oRect.top + 6
        );
      }

      function updateScore(delta) {
        score += Math.round(delta * gameSpeed * 0.4);
        scoreEl.textContent = score;
      }

      function finishGame() {
        isRunning = false;
        statusEl.textContent = 'Game Over';
        dino.classList.remove('running');
        clearInterval(obstacleTimer);
        stopLoop();
      }

      function jump() {
        if (!isRunning) startGame();
        if (!isRunning || isJumping) return;
        isJumping = true;
        velocityY = -jumpStrength;
      }

      speedRange.addEventListener('input', () => {
        gameSpeed = Number(speedRange.value);
        speedValue.textContent = gameSpeed;
        if (isRunning) {
          clearInterval(obstacleTimer);
          const interval = Math.max(900, spawnBase - (gameSpeed - 4) * 90);
          obstacleTimer = setInterval(createObstacle, interval);
        }
      });

      restartButton.addEventListener('click', resetGame);

      document.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
          event.preventDefault();
          jump();
        }
      });

      document.addEventListener('touchstart', (event) => {
        event.preventDefault();
        jump();
      }, { passive: false });

      resetGame();
    </script>
  </body>
</html>
